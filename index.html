<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#292a28">
  <meta name="description" content="Ретро LCD-игра про Олега, инвесторов и стартапы">
  <title>Как же так, Олег — LCD-игра</title>
  <link rel="stylesheet" href="styles.css?v=22">
</head>
<body>
  <main class="page">
    <section class="console" aria-label="Электронная игра Как же так, Олег">
      <div class="screen-wrap">
        <canvas id="game" width="960" height="600" aria-label="Игровой LCD-экран"></canvas>
        <div id="overlay" class="overlay">
          <strong>ЗАГРУЗКА</strong>
          <span>Подготавливаем спрайты…</span>
        </div>
      </div>
      <canvas id="achievement-card" class="achievement-card" width="820" height="330" aria-hidden="true"></canvas>

      <button class="round left-upper" data-lane="0" aria-label="Левая верхняя траектория"></button>
      <button class="round left-lower" data-lane="1" aria-label="Левая нижняя траектория"></button>
      <button class="round right-upper" data-lane="2" aria-label="Правая верхняя траектория"></button>
      <button class="round right-lower" data-lane="3" aria-label="Правая нижняя траектория"></button>

      <button id="start" class="cream-button start-button" aria-label="Старт" disabled></button>
      <button id="pause" class="cream-button pause-button" aria-label="Пауза"></button>
      <button id="sound" class="cream-button sound-button" aria-label="Звук включён" aria-pressed="true"></button>

      <output id="game-status" class="sr-only" aria-live="polite">Счёт 0, жизни 3, нажмите старт</output>
    </section>
    <p class="instructions">Красные кнопки — выбор позиции · ← → — сторона · ↑ ↓ — высота · пробел — пауза · Ctrl — звук</p>
  </main>
  <script src="game.js?v=53"></script>
</body>
</html>
