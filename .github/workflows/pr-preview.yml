name: Publish PR preview

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - reopened
      - synchronize
      - closed

permissions:
  contents: write
  deployments: read
  pull-requests: write

concurrency:
  group: github-pages-publish
  cancel-in-progress: false

jobs:
  preview:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Check out pull request
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Verify preview files
        if: github.event.action != 'closed'
        run: |
          test -f index.html
          test -f styles.css
          test -f game.js
          test -d assets
          test -f resources/oleg-exclamations.json

      - name: Prepare preview package
        if: github.event.action != 'closed'
        run: |
          mkdir -p .publish
          cp index.html styles.css game.js .publish/
          cp -R assets resources .publish/

      - name: Publish or remove preview
        id: preview
        uses: rossjrw/pr-preview-action@ffa7509e91a3ec8dfc2e5536c4d5c1acdf7a6de9 # v1.8.1
        with:
          source-dir: ./.publish
          preview-branch: gh-pages
          umbrella-dir: pr-preview
          action: auto
          comment: true
          qr-code: false
          wait-for-pages-deployment: true

      - name: Show preview URL
        if: steps.preview.outputs.deployment-action == 'deploy'
        run: echo "Preview ready at ${{ steps.preview.outputs.preview-url }}"
