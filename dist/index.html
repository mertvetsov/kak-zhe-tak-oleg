<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#d7c49f">
  <meta name="description" content="Ретро LCD-игра про Олега, инвесторов и стартапы">
  <title>Как же так, Олег — LCD-игра</title>
  <link rel="stylesheet" href="styles.css?v=20">
</head>
<body>
  <main class="page">
    <section class="console" aria-label="Электронная игра Как же так, Олег">
      <header class="brand">
        <span>ЭЛЕКТРОНИКА</span>
        <h1>КАК ЖЕ ТАК, ОЛЕГ</h1>
        <span>ИМ-26</span>
      </header>

      <div class="game-layout">
        <div class="controls controls-left">
          <button class="round" data-lane="0" aria-label="Левая верхняя траектория"></button>
          <button class="round" data-lane="1" aria-label="Левая нижняя траектория"></button>
        </div>

        <div class="screen-wrap">
          <canvas id="game" width="960" height="600" aria-label="Игровой LCD-экран"></canvas>
          <div id="overlay" class="overlay">
            <strong>ЗАГРУЗКА</strong>
            <span>Подготавливаем спрайты…</span>
          </div>
        </div>

        <div class="controls controls-right">
          <button class="round" data-lane="2" aria-label="Правая верхняя траектория"></button>
          <button class="round" data-lane="3" aria-label="Правая нижняя траектория"></button>
        </div>
      </div>

      <div class="bottom-panel">
        <button id="pause" class="small-button">ПАУЗА</button>
        <div class="mode-switch" role="group" aria-label="Режим игры">
          <button data-mode="A" disabled>ИГРА А</button>
          <button data-mode="B" disabled>ИГРА Б</button>
        </div>
        <button id="sound" class="small-button" aria-pressed="true">ЗВУК: ВКЛ</button>
      </div>

      <p class="instructions">Клик / касание по красным кнопкам · ← → — сторона · ↑ ↓ — высота · пробел — пауза</p>
      <output id="game-status" class="sr-only" aria-live="polite">Счёт 0, жизни 3, выберите режим</output>
      <div class="speaker" aria-hidden="true">••••••••••••</div>
    </section>
  </main>
  <script src="game.js?v=24"></script>
</body>
</html>
